<!doctype html><html><body><canvas id="c" width="64" height="64"></canvas><script type="module">
import { createCastle } from '../lib/castle.js';
try { const m = createCastle(document.getElementById('c'), { width: 64, height: 64 }); await m.load('../assets/');
  const toe = (t) => { m.poseAt(t); const p = m.LEG.l.toe.getWorldPosition(m.holder.position.clone()); const q = m.LEG.l.thigh.quaternion; return [p.x, p.y, p.z].map(v => (v * 100).toFixed(1)).join(',') + ' thighq ' + [q.x, q.y, q.z, q.w].map(v => v.toFixed(3)).join(','); };
  const out = []; for (const t of [15.55, 15.55, 15.55, 15.75, 15.55, 15.75, 15.75]) out.push(t + ' ' + toe(t));
  window.__info = out.join('\n'); } catch (e) { window.__info = 'PAGEERROR ' + e.stack; }
window.__done = 1;
</script></body></html>
