<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1080"></canvas><script type="module">
import * as THREE from '../lib/three.module.js';
import { GLTFLoader } from '../lib/jsm/loaders/GLTFLoader.js';
import { fixGirlMaterials } from '../lib/girlmat.js';
import { RoomEnvironment } from '../lib/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); r.setSize(1080,1080,false);
r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x556070);
sc.add(new THREE.HemisphereLight(0xffffff, 0x445544, 2.0)); const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(2, 4, 3); sc.add(d);

let info = 'bones ' + bones.length + ': ' + bones.join(',') + '\n';

  const box = new THREE.Box3().setFromObject(g.scene, true);

mixer.setTime(+(q.get('t') || 0)); g.scene.updateMatrixWorld(true);

r.render(sc, cam); window.__info = info; window.__done = 1;
</script></body></html>
