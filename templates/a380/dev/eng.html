<!doctype html><html><body><canvas id="c" width="64" height="64"></canvas><script type="module">
import * as THREE from '../lib/three.module.js';
import { createA380 } from '../lib/a380.js';
const m = createA380(document.getElementById('c'), { width: 64, height: 64 });
await m.load('../assets/');
const out = [];
for (const name of ['A', 'B']) {
  const root = window['__' + name]; root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert(); const v = new THREE.Vector3(); const cells = {};
  root.traverse((o) => { if (!o.isMesh) return; const P = o.geometry.attributes.position; const step = Math.max(1, Math.floor(P.count / 60000));
    const mats = o.isInstancedMesh ? [...Array(o.count).keys()].map((i) => { const M = new THREE.Matrix4(); o.getMatrixAt(i, M); return M; }) : [new THREE.Matrix4()];
    for (const M of mats) for (let i = 0; i < P.count; i += step) { v.set(P.getX(i), P.getY(i), P.getZ(i)).applyMatrix4(M).applyMatrix4(o.matrixWorld).applyMatrix4(inv);
      if (Math.abs(v.x) < 6 || v.y > 7 || v.y < 0.5) continue; const k = Math.round(v.x); if (!cells[k] || v.z < cells[k].z) cells[k] = { z: v.z, y: v.y }; } });
  out.push(name + ': ' + Object.entries(cells).sort((a, b) => a[0] - b[0]).map(([x, c]) => `${x}:${c.z.toFixed(0)}/${c.y.toFixed(1)}`).join(' '));
}
window.__info = out.join('\n'); window.__done = 1;
</script></body></html>
