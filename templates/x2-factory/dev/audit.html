<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="270" height="480"></canvas>
<script src="../lib/sync.js"></script>
<script>const q = new URLSearchParams(location.search); if (q.get("thumb")) window.X2THUMB = q.get("thumb").split(",").map(Number); if (q.get("kit0")) window.X2KIT0 = +q.get("kit0"); if (q.get("pitch")) window.X2PITCH = +q.get("pitch");</script>
<script type="module">
import { createFactory } from '../lib/factory.js';
import { createAudit } from '../lib/audit.js';
const m = createFactory(document.getElementById('c'), { width: 270, height: 480 });
await m.load('../assets/');
const A = createAudit(m.auditCtx());
window.__run = (t0, t1, dt) => { let n = 0; for (let t = t0; t <= t1 + 1e-6; t += dt) { m.render({ t, noDraw: 1 }); A.check(+t.toFixed(2)); n++; if (n % 20 === 0 && window.gc) window.gc(); } return { rep: A.report(), n }; };
window.__m = m; window.__done = 1;
</script></body></html>
